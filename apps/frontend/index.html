<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      background: #f3f4f6;
      color: #1f2937;
      font: 14px/1.4 "Trebuchet MS", "Segoe UI", sans-serif;
    }

    .app-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 18px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .map-card,
    .filter-card,
    .stats-card {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    }

    .map-card {
      width: 100%;
      padding: 8px;
    }

    #map {
      width: 100%;
      height: 450px;
      border-radius: 10px;
    }

    .filters-row,
    .stats-row {
      width: 100%;
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .filter-card {
      padding: 12px;
      text-align: center;
    }

    .filter-title {
      margin: 0 0 8px;
      font-size: 20px;
      line-height: 1;
      color: #0f172a;
    }

    .selector-control {
      width: 100%;
      max-width: 240px;
      padding: 4px 10px;
      border: 1px solid #9ca3af;
      border-radius: 8px;
      background: #f9fafb;
      color: #111827;
      font: 800 22px/1 "Trebuchet MS", "Segoe UI", sans-serif;
      letter-spacing: 0.3px;
      cursor: pointer;
      text-align: center;
    }

    .stats-card {
      width: 100%;
      padding: 12px;
    }

    .stats-title {
      margin: 0 0 10px;
      text-align: center;
      color: #0f172a;
      font-size: 34px;
      line-height: 1.05;
    }

    .stats-table {
      border: 1px solid #9ca3af;
      border-radius: 10px;
      min-height: 210px;
      overflow: hidden;
    }

    .stats-head,
    .stats-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
    }

    .stats-head {
      background: #f3f4f6;
      border-bottom: 1px solid #d1d5db;
      font-weight: 700;
      color: #111827;
      text-transform: lowercase;
    }

    .stats-item {
      border-top: 1px solid #e5e7eb;
    }

    .stats-item:first-child {
      border-top: 0;
    }

    .stats-name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #111827;
    }

    .route-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #9ca3af;
      border: 1px solid rgba(17, 24, 39, 0.25);
      flex-shrink: 0;
    }

    .stats-delay {
      color: #111827;
      font-weight: 700;
    }

    .stats-empty {
      color: #6b7280;
      text-align: center;
      padding: 14px;
      font-style: italic;
    }

    @media (max-width: 900px) {
      .filters-row,
      .stats-row {
        grid-template-columns: 1fr;
      }

      #map {
        height: 395px;
      }

      .filter-title {
        font-size: 18px;
      }

      .selector-control {
        font-size: 18px;
      }

      .stats-title {
        font-size: 26px;
      }
    }

    .leaflet-popup-content-wrapper {
      border-radius: 12px;
    }

    .stop-icon,
    .train-icon {
      display: grid;
      place-items: center;
      background: transparent;
      border: 0;
    }

    .stop-icon svg,
    .train-icon svg {
      display: block;
      filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.28));
    }

    .vehicle-popup {
      min-width: 220px;
      font: 13px/1.35 "Trebuchet MS", "Segoe UI", sans-serif;
      color: #1f2937;
    }

    .vehicle-popup .title {
      display: inline-block;
      margin-bottom: 8px;
      font-weight: 700;
      color: #0f172a;
    }

    .vehicle-popup .line {
      margin: 4px 0;
    }

    .vehicle-popup .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.2px;
      margin-left: 6px;
    }

    .vehicle-popup .badge.ok {
      background: #d1fae5;
      color: #065f46;
    }

    .vehicle-popup .badge.warn {
      background: #fee2e2;
      color: #991b1b;
    }

    .vehicle-popup .badge.neutral {
      background: #e5e7eb;
      color: #374151;
    }

    .stop-popup {
      min-width: 240px;
      font: 13px/1.35 "Trebuchet MS", "Segoe UI", sans-serif;
      color: #1f2937;
    }

    .stop-popup .title {
      margin-bottom: 8px;
      font-weight: 700;
      color: #0f172a;
    }

    .stop-popup .empty {
      color: #6b7280;
      font-style: italic;
    }

    .stop-popup .arrival-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 0;
      border-top: 1px solid #e5e7eb;
    }

    .stop-popup .arrival-row:first-of-type {
      border-top: 0;
    }

    .stop-popup .route-chip {
      background: #dbeafe;
      color: #1e3a8a;
      border-radius: 999px;
      padding: 2px 8px;
      font-weight: 700;
      font-size: 11px;
      min-width: 26px;
      text-align: center;
    }

    .stop-popup .arrival-meta {
      color: #111827;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <section class="map-card">
      <div id="map"></div>
    </section>

    <section class="filters-row">
      <article class="filter-card">
        <h2 class="filter-title">Routes showing</h2>
        <select id="route-select" class="selector-control" aria-label="Routes showing">
          <option value="ALL">ALL</option>
        </select>
      </article>
      <article class="filter-card">
        <h2 class="filter-title">Select stop</h2>
        <select id="stop-select" class="selector-control" aria-label="Select stop">
          <option value="ALL">ALL</option>
        </select>
      </article>
    </section>

    <section class="stats-row">
      <article class="stats-card">
        <h2 class="stats-title">Most delayed routes</h2>
        <div class="stats-table">
          <div class="stats-head"><span>route id</span><span>avg delay</span></div>
          <div id="top-routes-list" class="stats-body"></div>
        </div>
      </article>

      <article class="stats-card">
        <h2 class="stats-title">Stops with most delays</h2>
        <div class="stats-table">
          <div class="stats-head"><span>stop id</span><span>avg delay</span></div>
          <div id="top-stops-list" class="stats-body"></div>
        </div>
      </article>
    </section>
  </div>

  <div id="status" style="position:fixed;top:10px;left:10px;z-index:1000;background:#fff;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font:12px/1.4 sans-serif;display:none;"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    const map = L.map("map").setView([41.3851, 2.1734], 12);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 14,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const apiBaseUrl = "http://localhost:8000";
    const stopsPath = `${apiBaseUrl}/stops`;
    const shapesPath = `${apiBaseUrl}/shapes`;
    const topRoutesPathCandidates = [`${apiBaseUrl}/top_routes.json`, `${apiBaseUrl}/top_routes`];
    const topStopsPathCandidates = [`${apiBaseUrl}/top_stops.json`, `${apiBaseUrl}/top_stops`];
    const vehiclesPathCandidates = [`${apiBaseUrl}/vehicles.json`, `${apiBaseUrl}/vehicles`];
    const arrivalTimesPathCandidates = [`${apiBaseUrl}/arrival_times.json`, `${apiBaseUrl}/arrival_times`];
    const vehiclesRefreshIntervalMs = 30000;
    const statusEl = document.getElementById("status");
    const routeSelectEl = document.getElementById("route-select");
    const stopSelectEl = document.getElementById("stop-select");
    const topRoutesListEl = document.getElementById("top-routes-list");
    const topStopsListEl = document.getElementById("top-stops-list");
    const stopsLayer = L.layerGroup().addTo(map);
    const shapesLayer = L.layerGroup().addTo(map);
    const vehiclesLayer = L.layerGroup().addTo(map);
    const staticBounds = L.latLngBounds([]);
    const stopMarkersById = new Map();
    const stopCoordinatesById = new Map();
    const stopCoordinatesByName = new Map();
    const shapeTracks = [];
    const shapeTracksById = new Map();
    const vehicleMarkersByKey = new Map();
    const trainAnimationSpeedMetersPerSecond = 14;
    const trainCorrectionDurationMs = 5000;
    const maxTrainLeadMeters = 900;
    let selectedRoute = "ALL";
    let latestVehiclesData = null;
    let mapHasFittedBounds = false;
    let trainAnimationFrameId = null;

    function showStatus(message) {
      statusEl.textContent = message;
      statusEl.style.display = "block";
    }

    function hideStatus() {
      statusEl.style.display = "none";
    }

    function occupancyLabel(rawValue) {
      const value = String(rawValue || "").trim().toUpperCase();
      if (!value || value === "NO_DATA_AVAILABLE") {
        return "Occupancy unknown";
      }
      if (value.includes("EMPTY")) {
        return "Almost empty";
      }
      if (value.includes("MANY_SEATS_AVAILABLE")) {
        return "Many seats available";
      }
      if (value.includes("FEW_SEATS_AVAILABLE")) {
        return "Few seats available";
      }
      if (value.includes("STANDING_ROOM_ONLY")) {
        return "Standing room only";
      }
      if (value.includes("CRUSHED_STANDING_ROOM_ONLY")) {
        return "Very crowded";
      }
      if (value.includes("FULL")) {
        return "Full";
      }
      if (value.includes("NOT_ACCEPTING_PASSENGERS")) {
        return "Not accepting passengers";
      }
      return "Occupancy unknown";
    }

    function scheduleBadgeHtml(scheduleState) {
      const value = String(scheduleState || "").toLowerCase();
      if (value === "late") {
        return '<span class="badge warn">Late</span>';
      }
      if (value === "on time") {
        return '<span class="badge ok">On time</span>';
      }
      return '<span class="badge neutral">Unknown</span>';
    }

    function vehiclePopupHtml(vehicle) {
      const route = vehicle.route_short_name || "Unknown route";
      const nextStop = vehicle.next_stop || "Unknown stop";
      const origin = vehicle.origin || "Unknown";
      const destination = vehicle.destination || "Unknown";
      const occupancy = occupancyLabel(vehicle.occupancy_status);
      const scheduleBadge = scheduleBadgeHtml(vehicle.schedule_state);

      return `
        <div class="vehicle-popup">
          <div class="title">Route ${route} ${scheduleBadge}</div>
          <div class="line">Next stop: <strong>${nextStop}</strong></div>
          <div class="line">Trip: ${origin} -> ${destination}</div>
          <div class="line">Occupancy: ${occupancy}</div>
        </div>
      `;
    }

    function markerColorFromRoute(vehicle) {
      const rawColor = String(vehicle.route_color || "").trim();
      if (/^[0-9a-fA-F]{6}$/.test(rawColor)) {
        return `#${rawColor}`;
      }
      if (/^#[0-9a-fA-F]{6}$/.test(rawColor)) {
        return rawColor;
      }
      return "#ff3b30";
    }

    function normalizeRouteColor(rawValue) {
      const rawColor = String(rawValue || "").trim();
      if (/^[0-9a-fA-F]{6}$/.test(rawColor)) {
        return `#${rawColor}`;
      }
      if (/^#[0-9a-fA-F]{6}$/.test(rawColor)) {
        return rawColor;
      }
      return null;
    }

    function routeChipStyle(routeColor) {
      const color = normalizeRouteColor(routeColor);
      if (!color) {
        return "";
      }
      return `style="background:${color};color:#ffffff;"`;
    }

    function routeDotStyle(routeColor) {
      const color = normalizeRouteColor(routeColor);
      if (!color) {
        return "";
      }
      return `style="background:${color};"`;
    }

    function stopIcon() {
      return L.divIcon({
        className: "stop-icon",
        iconSize: [18, 18],
        iconAnchor: [9, 9],
        popupAnchor: [0, -9],
        html: `
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="6" y="3" width="12" height="13" rx="2.5" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
            <rect x="8" y="5" width="8" height="4" rx="1" fill="#2563eb"/>
            <circle cx="9.5" cy="13" r="1.2" fill="#1f2937"/>
            <circle cx="14.5" cy="13" r="1.2" fill="#1f2937"/>
            <path d="M8 20h8M10 16v4M14 16v4" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        `
      });
    }

    function trainIcon(markerColor) {
      return L.divIcon({
        className: "train-icon",
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -15],
        html: `
          <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <path d="M11 3.5h10a4 4 0 0 1 4 4v12.8a4 4 0 0 1-4 4H11a4 4 0 0 1-4-4V7.5a4 4 0 0 1 4-4Z" fill="${markerColor}" stroke="#1f2937" stroke-width="1.2"/>
            <path d="M11 8h10v5H11z" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"/>
            <circle cx="12" cy="18.7" r="1.8" fill="#ffffff"/>
            <circle cx="20" cy="18.7" r="1.8" fill="#ffffff"/>
            <path d="M12 24.3 9.5 28M20 24.3l2.5 3.7M11 27.5h10" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
          </svg>
        `
      });
    }

    function buildShapeTrack(shape) {
      const coordinates = shape.coordinates || [];
      const cumulativeDistances = [0];
      for (let index = 1; index < coordinates.length; index += 1) {
        const previous = coordinates[index - 1];
        const current = coordinates[index];
        const segmentLength = map.distance(previous, current);
        cumulativeDistances.push(cumulativeDistances[index - 1] + segmentLength);
      }

      return {
        shapeId: String(shape.shape_id || ""),
        otherIds: shape.other_ids || [],
        coordinates,
        cumulativeDistances,
        totalDistance: cumulativeDistances[cumulativeDistances.length - 1] || 0
      };
    }

    function indexShapeTrack(track) {
      const ids = [track.shapeId, ...track.otherIds].filter((shapeId) => shapeId !== "");
      for (const shapeId of ids) {
        shapeTracksById.set(String(shapeId), track);
      }
    }

    function metersPoint(lat, lon, referenceLat) {
      const latMeters = lat * 111320;
      const lonMeters = lon * 111320 * Math.cos(referenceLat * Math.PI / 180);
      return { x: lonMeters, y: latMeters };
    }

    function coordinateAtShapeDistance(track, distanceMeters) {
      if (!track || track.coordinates.length === 0) {
        return null;
      }

      const clampedDistance = Math.max(0, Math.min(distanceMeters, track.totalDistance));
      for (let index = 1; index < track.coordinates.length; index += 1) {
        const previousDistance = track.cumulativeDistances[index - 1];
        const nextDistance = track.cumulativeDistances[index];
        if (clampedDistance > nextDistance) {
          continue;
        }

        const segmentLength = nextDistance - previousDistance;
        const ratio = segmentLength === 0 ? 0 : (clampedDistance - previousDistance) / segmentLength;
        const previous = track.coordinates[index - 1];
        const next = track.coordinates[index];
        return [
          previous[0] + ((next[0] - previous[0]) * ratio),
          previous[1] + ((next[1] - previous[1]) * ratio)
        ];
      }

      return track.coordinates[track.coordinates.length - 1];
    }

    function projectPointToShape(lat, lon, track) {
      if (!track || track.coordinates.length < 2) {
        return null;
      }

      const point = metersPoint(lat, lon, lat);
      let bestProjection = null;
      let bestDistanceSquared = Infinity;

      for (let index = 1; index < track.coordinates.length; index += 1) {
        const previous = track.coordinates[index - 1];
        const next = track.coordinates[index];
        const start = metersPoint(previous[0], previous[1], lat);
        const end = metersPoint(next[0], next[1], lat);
        const dx = end.x - start.x;
        const dy = end.y - start.y;
        const segmentLengthSquared = (dx * dx) + (dy * dy);
        const ratio = segmentLengthSquared === 0
          ? 0
          : Math.max(0, Math.min(1, (((point.x - start.x) * dx) + ((point.y - start.y) * dy)) / segmentLengthSquared));
        const projectedX = start.x + (dx * ratio);
        const projectedY = start.y + (dy * ratio);
        const distanceSquared = ((point.x - projectedX) ** 2) + ((point.y - projectedY) ** 2);

        if (distanceSquared < bestDistanceSquared) {
          const previousDistance = track.cumulativeDistances[index - 1];
          const nextDistance = track.cumulativeDistances[index];
          const distanceAlongShape = previousDistance + ((nextDistance - previousDistance) * ratio);
          bestDistanceSquared = distanceSquared;
          bestProjection = {
            track,
            distanceAlongShape,
            distanceFromShape: Math.sqrt(distanceSquared),
            coordinates: coordinateAtShapeDistance(track, distanceAlongShape)
          };
        }
      }

      return bestProjection;
    }

    function vehicleShapeProjection(vehicle, lat, lon) {
      const shapeId = String(vehicle.shape_id || "").trim();
      const directTrack = shapeId ? shapeTracksById.get(shapeId) : null;
      if (directTrack) {
        return projectPointToShape(lat, lon, directTrack);
      }

      let bestProjection = null;
      let bestDirectionalProjection = null;
      for (const track of shapeTracks) {
        const projection = projectPointToShape(lat, lon, track);
        if (!projection) {
          continue;
        }
        if (shapeMatchesVehicleDirection(vehicle, track)) {
          if (!bestDirectionalProjection || projection.distanceFromShape < bestDirectionalProjection.distanceFromShape) {
            bestDirectionalProjection = projection;
          }
        }
        if (!bestProjection || projection.distanceFromShape < bestProjection.distanceFromShape) {
          bestProjection = projection;
        }
      }
      return bestDirectionalProjection || bestProjection;
    }

    function shapeMatchesVehicleDirection(vehicle, track) {
      const originCoordinates = stopCoordinatesByName.get(String(vehicle.origin || ""));
      const destinationCoordinates = stopCoordinatesByName.get(String(vehicle.destination || ""));
      if (!originCoordinates || !destinationCoordinates) {
        return false;
      }

      const originProjection = projectPointToShape(originCoordinates[0], originCoordinates[1], track);
      const destinationProjection = projectPointToShape(destinationCoordinates[0], destinationCoordinates[1], track);
      if (!originProjection || !destinationProjection) {
        return false;
      }
      return originProjection.distanceAlongShape < destinationProjection.distanceAlongShape;
    }

    function vehicleMarkerKey(vehicle, index) {
      const vehicleId = String(vehicle.vehicle_id || "").trim();
      if (vehicleId) {
        return `vehicle:${vehicleId}`;
      }

      const tripId = String(vehicle.trip_id || "").trim();
      if (tripId) {
        return `trip:${tripId}`;
      }

      return [
        "fallback",
        vehicle.route_short_name || "",
        vehicle.origin || "",
        vehicle.destination || "",
        index
      ].join(":");
    }

    function updateAnimatedTrainPositions(timestampMs) {
      for (const markerState of vehicleMarkersByKey.values()) {
        if (!markerState.track) {
          continue;
        }

        const elapsedSeconds = markerState.lastAnimationMs
          ? Math.max(0, (timestampMs - markerState.lastAnimationMs) / 1000)
          : 0;
        markerState.lastAnimationMs = timestampMs;

        if (markerState.correctionEndMs && timestampMs < markerState.correctionEndMs) {
          const correctionRatio = (timestampMs - markerState.correctionStartMs) / (markerState.correctionEndMs - markerState.correctionStartMs);
          markerState.currentDistance = markerState.correctionStartDistance + ((markerState.targetDistance - markerState.correctionStartDistance) * correctionRatio);
        } else {
          markerState.correctionEndMs = null;
          const nextDistance = markerState.currentDistance + (trainAnimationSpeedMetersPerSecond * elapsedSeconds);
          const maxDistance = Math.min(markerState.targetDistance + maxTrainLeadMeters, markerState.track.totalDistance);
          markerState.currentDistance = Math.min(nextDistance, maxDistance);
        }

        const coordinates = coordinateAtShapeDistance(markerState.track, markerState.currentDistance);
        if (coordinates) {
          markerState.marker.setLatLng(coordinates);
        }
      }

      trainAnimationFrameId = window.requestAnimationFrame(updateAnimatedTrainPositions);
    }

    function startTrainAnimationLoop() {
      if (trainAnimationFrameId === null) {
        trainAnimationFrameId = window.requestAnimationFrame(updateAnimatedTrainPositions);
      }
    }

    function formatDelay(delayValue) {
      const totalSeconds = Number(delayValue);
      if (Number.isNaN(totalSeconds)) {
        return "-";
      }

      const sign = totalSeconds < 0 ? "-" : "";
      const absolute = Math.abs(Math.round(totalSeconds));
      const minutes = Math.floor(absolute / 60);
      const seconds = String(absolute % 60).padStart(2, "0");
      return `${sign}${minutes}:${seconds}`;
    }

    function renderTopRoutes(topRoutesData) {
      const routes = Object.values(topRoutesData || {});
      if (routes.length === 0) {
        topRoutesListEl.innerHTML = '<div class="stats-empty">No delay data available</div>';
        return;
      }

      topRoutesListEl.innerHTML = routes
        .map((route) => {
          const name = route.route_name || "Unknown route";
          const delay = formatDelay(route.delay);
          const dotStyle = routeDotStyle(route.route_color);
          return `
            <div class="stats-item">
              <span class="stats-name"><span class="route-dot" ${dotStyle}></span>${name}</span>
              <span class="stats-delay">${delay}</span>
            </div>
          `;
        })
        .join("");
    }

    function renderTopStops(topStopsData) {
      const stops = Object.values(topStopsData || {});
      if (stops.length === 0) {
        topStopsListEl.innerHTML = '<div class="stats-empty">No delay data available</div>';
        return;
      }

      topStopsListEl.innerHTML = stops
        .map((stop) => {
          const name = stop.stop_name || "Unknown stop";
          const delay = formatDelay(stop.delay);
          return `
            <div class="stats-item">
              <span class="stats-name">${name}</span>
              <span class="stats-delay">${delay}</span>
            </div>
          `;
        })
        .join("");
    }

    function fitMapToStaticLayers() {
      if (!mapHasFittedBounds && staticBounds.isValid()) {
        map.fitBounds(staticBounds, { padding: [20, 20] });
        mapHasFittedBounds = true;
      }
    }

    function drawStops(stopsData) {
      for (const stop of stopsData.stops || []) {
        const lat = Number(stop.stop_lat);
        const lon = Number(stop.stop_lon);
        const stopId = String(stop.stop_id || "");
        const stopName = stop.stop_name || stopId || "Stop";
        if (Number.isNaN(lat) || Number.isNaN(lon)) {
          continue;
        }

        const marker = L.marker([lat, lon], {
          icon: stopIcon(),
          zIndexOffset: 100
        })
          .addTo(stopsLayer)
          .bindPopup(stopName);

        if (stopId) {
          stopMarkersById.set(stopId, {
            marker,
            stopName
          });
          stopCoordinatesById.set(stopId, [lat, lon]);
          stopCoordinatesByName.set(stopName, [lat, lon]);
        }

        staticBounds.extend([lat, lon]);
      }

      updateStopSelectorOptions();
    }

    function updateStopSelectorOptions() {
      const stops = Array.from(stopMarkersById.entries())
        .map(([stopId, markerInfo]) => ({
          stopId,
          stopName: markerInfo.stopName || stopId
        }))
        .sort((left, right) => left.stopName.localeCompare(right.stopName));

      const previousValue = stopSelectEl.value || "ALL";
      stopSelectEl.innerHTML = [
        '<option value="ALL">ALL</option>',
        ...stops.map((stop) => `<option value="${stop.stopId}">${stop.stopName}</option>`)
      ].join("");

      if (previousValue === "ALL" || stopCoordinatesById.has(previousValue)) {
        stopSelectEl.value = previousValue;
      } else {
        stopSelectEl.value = "ALL";
      }
    }

    function updateRouteSelectorOptions(vehiclesData) {
      const routeNames = Array.from(new Set(
        (vehiclesData.vehicles || [])
          .map((vehicle) => String(vehicle.route_short_name || "").trim())
          .filter((routeName) => routeName !== "")
      )).sort((left, right) => left.localeCompare(right));

      const previousValue = routeSelectEl.value || selectedRoute || "ALL";
      routeSelectEl.innerHTML = [
        '<option value="ALL">ALL</option>',
        ...routeNames.map((routeName) => `<option value="${routeName}">${routeName}</option>`)
      ].join("");

      if (previousValue === "ALL" || routeNames.includes(previousValue)) {
        routeSelectEl.value = previousValue;
        selectedRoute = previousValue;
      } else {
        routeSelectEl.value = "ALL";
        selectedRoute = "ALL";
      }
    }

    function stopPopupHtml(stopName, arrivalsByTrip) {
      const arrivals = Object.values(arrivalsByTrip || {});

      arrivals.sort((left, right) => {
        const leftMinutes = Number(left.arrival_time_minutes);
        const rightMinutes = Number(right.arrival_time_minutes);
        if (Number.isNaN(leftMinutes) || Number.isNaN(rightMinutes)) {
          return 0;
        }
        return leftMinutes - rightMinutes;
      });

      if (arrivals.length === 0) {
        return `
          <div class="stop-popup">
            <div class="title">${stopName}</div>
            <div class="empty">No upcoming arrivals</div>
          </div>
        `;
      }

      const rows = [];
      for (const arrival of arrivals) {
        const routeShortName = arrival.route_short_name || "-";
        const minutes = arrival.arrival_time_minutes;
        const platform = arrival.platform || "-";
        const chipStyle = routeChipStyle(arrival.route_color);
        rows.push(`
          <div class="arrival-row">
            <span class="route-chip" ${chipStyle}>${routeShortName}</span>
            <span class="arrival-meta">${minutes} (min) platform ${platform}</span>
          </div>
        `);
      }

      return `
        <div class="stop-popup">
          <div class="title">${stopName}</div>
          ${rows.join("")}
        </div>
      `;
    }

    function updateStopsArrivalPopups(arrivalTimesData) {
      for (const [stopId, markerInfo] of stopMarkersById.entries()) {
        const arrivalsByTrip = arrivalTimesData[stopId] || {};
        markerInfo.marker.setPopupContent(stopPopupHtml(markerInfo.stopName, arrivalsByTrip));
      }
    }

    function drawShapes(shapesData) {
      for (const shape of shapesData.shapes || []) {
        const coordinates = shape.coordinates || [];
        if (coordinates.length < 2) {
          continue;
        }

        L.polyline(coordinates, {
          color: "#1f6feb",
          weight: 3,
          opacity: 0.7
        }).addTo(shapesLayer);

        const track = buildShapeTrack(shape);
        shapeTracks.push(track);
        indexShapeTrack(track);

        for (const point of coordinates) {
          staticBounds.extend(point);
        }
      }
    }

    function drawVehicles(vehiclesData) {
      const visibleVehicleKeys = new Set();
      const now = performance.now();

      for (const [index, vehicle] of (vehiclesData.vehicles || []).entries()) {
        const routeName = String(vehicle.route_short_name || "").trim();
        if (selectedRoute !== "ALL" && routeName !== selectedRoute) {
          continue;
        }

        const lat = Number(vehicle.latitude);
        const lon = Number(vehicle.longitude);
        const markerColor = markerColorFromRoute(vehicle);
        if (Number.isNaN(lat) || Number.isNaN(lon)) {
          continue;
        }

        const vehicleKey = vehicleMarkerKey(vehicle, index);
        const projection = vehicleShapeProjection(vehicle, lat, lon);
        const markerCoordinates = projection && projection.coordinates ? projection.coordinates : [lat, lon];
        visibleVehicleKeys.add(vehicleKey);

        if (!vehicleMarkersByKey.has(vehicleKey)) {
          const marker = L.marker(markerCoordinates, {
            icon: trainIcon(markerColor),
            zIndexOffset: 500
          })
            .addTo(vehiclesLayer)
            .bindPopup(vehiclePopupHtml(vehicle), { className: "vehicle-popup-shell" });

          vehicleMarkersByKey.set(vehicleKey, {
            marker,
            track: projection ? projection.track : null,
            currentDistance: projection ? projection.distanceAlongShape : 0,
            targetDistance: projection ? projection.distanceAlongShape : 0,
            correctionStartDistance: projection ? projection.distanceAlongShape : 0,
            correctionStartMs: now,
            correctionEndMs: null,
            lastAnimationMs: now
          });
          continue;
        }

        const markerState = vehicleMarkersByKey.get(vehicleKey);
        markerState.marker.setIcon(trainIcon(markerColor));
        markerState.marker.setPopupContent(vehiclePopupHtml(vehicle));

        if (!projection) {
          markerState.track = null;
          markerState.marker.setLatLng([lat, lon]);
          continue;
        }

        const sameTrack = markerState.track === projection.track;
        markerState.track = projection.track;
        markerState.targetDistance = projection.distanceAlongShape;
        markerState.correctionStartDistance = sameTrack ? markerState.currentDistance : projection.distanceAlongShape;
        markerState.correctionStartMs = now;
        markerState.correctionEndMs = sameTrack ? now + trainCorrectionDurationMs : null;
        if (!sameTrack) {
          markerState.currentDistance = projection.distanceAlongShape;
          markerState.marker.setLatLng(markerCoordinates);
        }
      }

      for (const [vehicleKey, markerState] of vehicleMarkersByKey.entries()) {
        if (visibleVehicleKeys.has(vehicleKey)) {
          continue;
        }
        vehiclesLayer.removeLayer(markerState.marker);
        vehicleMarkersByKey.delete(vehicleKey);
      }

      startTrainAnimationLoop();
    }

    async function loadStaticLayers() {
      const [stopsResponse, shapesResponse] = await Promise.all([
        fetch(stopsPath),
        fetch(shapesPath)
      ]);

      if (!stopsResponse.ok) {
        throw new Error(`Stops request failed with status ${stopsResponse.status}`);
      }

      if (!shapesResponse.ok) {
        throw new Error(`Shapes request failed with status ${shapesResponse.status}`);
      }

      const stopsData = await stopsResponse.json();
      const shapesData = await shapesResponse.json();

      drawStops(stopsData);
      drawShapes(shapesData);
      fitMapToStaticLayers();
    }

    async function fetchFirstOkJson(pathCandidates) {
      for (const path of pathCandidates) {
        const response = await fetch(path);
        if (response.ok) {
          return response.json();
        }
      }
      throw new Error(`Request failed for paths: ${pathCandidates.join(", ")}`);
    }

    async function refreshRealtimeLayers() {
      const [vehiclesData, arrivalTimesData] = await Promise.all([
        fetchFirstOkJson(vehiclesPathCandidates),
        fetchFirstOkJson(arrivalTimesPathCandidates)
      ]);

      latestVehiclesData = vehiclesData;
      updateRouteSelectorOptions(vehiclesData);
      drawVehicles(vehiclesData);
      if (arrivalTimesData && typeof arrivalTimesData === "object") {
        updateStopsArrivalPopups(arrivalTimesData);
      }
    }

    function setupFilterInteractions() {
      routeSelectEl.addEventListener("change", () => {
        selectedRoute = routeSelectEl.value || "ALL";
        if (latestVehiclesData !== null) {
          drawVehicles(latestVehiclesData);
        }
      });

      stopSelectEl.addEventListener("change", () => {
        const selectedStopId = stopSelectEl.value || "ALL";
        if (selectedStopId === "ALL") {
          if (staticBounds.isValid()) {
            map.fitBounds(staticBounds, { padding: [20, 20] });
          }
          return;
        }

        if (!stopCoordinatesById.has(selectedStopId)) {
          return;
        }

        const coordinates = stopCoordinatesById.get(selectedStopId);
        map.setView(coordinates, 14);

        const markerInfo = stopMarkersById.get(selectedStopId);
        if (markerInfo) {
          markerInfo.marker.openPopup();
        }
      });
    }

    async function loadTopDelayPanels() {
      const [topRoutesData, topStopsData] = await Promise.all([
        fetchFirstOkJson(topRoutesPathCandidates),
        fetchFirstOkJson(topStopsPathCandidates)
      ]);

      renderTopRoutes(topRoutesData);
      renderTopStops(topStopsData);
    }

    async function initializeMap() {
      setupFilterInteractions();
      try {
        await loadStaticLayers();
        await refreshRealtimeLayers();
        await loadTopDelayPanels();
        hideStatus();
      } catch (error) {
        console.error("Error loading map data", error);
        showStatus("Error loading API data from localhost:8000. Check API status and CORS configuration.");
        return;
      }

      setInterval(async () => {
        try {
          await refreshRealtimeLayers();
          hideStatus();
        } catch (error) {
          console.error("Error refreshing realtime data", error);
          showStatus("Error refreshing vehicles/arrival_times from localhost:8000.");
        }
      }, vehiclesRefreshIntervalMs);
    }

    initializeMap();
  </script>
</body>
</html>
