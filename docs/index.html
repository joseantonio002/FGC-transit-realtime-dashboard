<!--
Sales Dashboard Prototype (Static Frontend)

Run locally:
  cd docs
  python -m http.server 8000
  # then open http://localhost:8000

Backend should be running at (default):
  http://localhost:5000

API base URL config:
  - Use the "API Base" field on the page (stored in localStorage), or
  - Pass ?apiBase=http://localhost:5000 in the URL.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sales Dashboard Prototype</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

    <style>
      :root {
        --bg0: #fbfbf8;
        --bg1: #f2f3ee;
        --card: rgba(255, 255, 255, 0.78);
        --cardBorder: rgba(25, 28, 32, 0.10);
        --text: #14181f;
        --muted: rgba(20, 24, 31, 0.70);
        --line: rgba(20, 24, 31, 0.14);
        --accent: #1a5a7a;
        --accent2: #d07c3e;
        --danger: #b3322e;
        --shadow: 0 18px 50px rgba(10, 18, 26, 0.10);
        --radius: 16px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--text);
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background:
          radial-gradient(900px 450px at 10% 10%, rgba(208, 124, 62, 0.12), transparent 60%),
          radial-gradient(900px 450px at 85% 20%, rgba(26, 90, 122, 0.14), transparent 55%),
          linear-gradient(180deg, var(--bg0), var(--bg1));
        min-height: 100vh;
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 28px 18px 40px;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.02em;
      }

      .sub {
        margin-top: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--cardBorder);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
        padding: 14px;
      }

      .controls {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 12px;
        align-items: end;
      }

      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 6px;
      }

      input, select, button {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.9);
        color: var(--text);
        font: inherit;
        outline: none;
      }

      input:focus, select:focus {
        border-color: rgba(26, 90, 122, 0.55);
        box-shadow: 0 0 0 4px rgba(26, 90, 122, 0.10);
      }

      .apiRow {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      button {
        width: auto;
        padding: 10px 14px;
        border-color: rgba(26, 90, 122, 0.30);
        background: linear-gradient(180deg, rgba(26, 90, 122, 0.12), rgba(26, 90, 122, 0.06));
        cursor: pointer;
      }

      button:hover { border-color: rgba(26, 90, 122, 0.45); }

      .status {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px dashed rgba(20, 24, 31, 0.18);
        background: rgba(255, 255, 255, 0.55);
        color: var(--muted);
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .pill {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid rgba(20, 24, 31, 0.16);
        color: rgba(20, 24, 31, 0.75);
        background: rgba(255, 255, 255, 0.8);
        white-space: nowrap;
      }

      .pill.loading {
        border-color: rgba(208, 124, 62, 0.35);
        color: rgba(80, 44, 20, 0.88);
      }

      .pill.error {
        border-color: rgba(179, 50, 46, 0.35);
        color: rgba(100, 18, 16, 0.90);
      }

      .chart {
        margin-top: 14px;
        padding: 12px;
      }

      #chart {
        width: 100%;
        height: 420px;
      }

      @media (max-width: 760px) {
        header { flex-direction: column; align-items: flex-start; }
        .controls { grid-template-columns: 1fr; }
        #chart { height: 360px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Sales Dashboard</h1>
          <div class="sub">Lazy-fetching data from a local API, visualized with Plotly.</div>
        </div>
      </header>

      <div class="card">
        <div class="controls">
          <div>
            <label for="apiBase">API Base</label>
            <div class="apiRow">
              <input id="apiBase" type="text" placeholder="http://localhost:5000" />
              <button id="saveApi" type="button">Save</button>
            </div>
          </div>

          <div>
            <label for="storeSelect">Store</label>
            <select id="storeSelect" disabled>
              <option value="">Loading stores...</option>
            </select>
          </div>
        </div>

        <div class="status" aria-live="polite">
          <div id="statusText">Ready.</div>
          <div id="statusPill" class="pill">idle</div>
        </div>

        <div class="chart">
          <div id="chart"></div>
        </div>
      </div>
    </div>

    <script>
      const DEFAULT_API_BASE = "http://localhost:5000";

      function log(...args) {
        console.log("[dashboard]", ...args);
      }

      function getApiBaseFromUrl() {
        const url = new URL(window.location.href);
        const val = (url.searchParams.get("apiBase") || "").trim();
        return val || null;
      }

      function getApiBase() {
        return (
          getApiBaseFromUrl() ||
          (localStorage.getItem("apiBase") || "").trim() ||
          DEFAULT_API_BASE
        );
      }

      function setPill(kind, text) {
        const pill = document.getElementById("statusPill");
        pill.className = "pill";
        if (kind === "loading") pill.classList.add("loading");
        if (kind === "error") pill.classList.add("error");
        pill.textContent = text;
      }

      function setStatus(text, kind = "idle") {
        document.getElementById("statusText").textContent = text;
        setPill(kind, kind);
      }

      async function fetchJson(path) {
        const apiBase = getApiBase().replace(/\/+$/, "");
        const url = `${apiBase}${path}`;
        log("fetch", url);
        const res = await fetch(url, { headers: { "Accept": "application/json" } });
        const contentType = (res.headers.get("content-type") || "").toLowerCase();
        const isJson = contentType.includes("application/json");
        const body = isJson ? await res.json() : await res.text();
        if (!res.ok) {
          const detail = isJson ? JSON.stringify(body) : String(body).slice(0, 200);
          throw new Error(`HTTP ${res.status} from ${url}: ${detail}`);
        }
        return body;
      }

      function renderEmptyChart() {
        Plotly.newPlot(
          "chart",
          [
            {
              type: "bar",
              x: [],
              y: [],
              marker: { color: "rgba(26, 90, 122, 0.55)" },
              hovertemplate: "<b>%{x}</b><br>Sales: %{y:,}<extra></extra>",
            },
          ],
          {
            margin: { l: 50, r: 18, t: 18, b: 52 },
            paper_bgcolor: "rgba(0,0,0,0)",
            plot_bgcolor: "rgba(255,255,255,0.55)",
            font: { family: "IBM Plex Sans, ui-sans-serif, system-ui" },
            xaxis: { title: { text: "Quarter" }, gridcolor: "rgba(20,24,31,0.10)" },
            yaxis: { title: { text: "Sales" }, gridcolor: "rgba(20,24,31,0.10)" },
          },
          { displayModeBar: false, responsive: true }
        );
      }

      function renderSalesChart(store, rows) {
        const quarters = rows.map((r) => r.quarter);
        const sales = rows.map((r) => r.sales);

        Plotly.react(
          "chart",
          [
            {
              type: "bar",
              x: quarters,
              y: sales,
              marker: {
                color: "rgba(26, 90, 122, 0.65)",
                line: { color: "rgba(20,24,31,0.25)", width: 1 },
              },
              hovertemplate: "<b>%{x}</b><br>Sales: %{y:,}<extra></extra>",
            },
          ],
          {
            title: { text: `Sales by Quarter - ${store}`, x: 0.02, xanchor: "left" },
            margin: { l: 60, r: 18, t: 52, b: 56 },
            paper_bgcolor: "rgba(0,0,0,0)",
            plot_bgcolor: "rgba(255,255,255,0.55)",
            font: { family: "IBM Plex Sans, ui-sans-serif, system-ui" },
            xaxis: { title: { text: "Quarter" }, gridcolor: "rgba(20,24,31,0.10)" },
            yaxis: {
              title: { text: "Sales" },
              gridcolor: "rgba(20,24,31,0.10)",
              tickformat: ",",
            },
          },
          { displayModeBar: false, responsive: true }
        );
      }

      async function loadStores() {
        const storeSelect = document.getElementById("storeSelect");
        storeSelect.disabled = true;
        storeSelect.innerHTML = "<option value=\"\">Loading stores...</option>";

        setStatus("Fetching stores...", "loading");
        const payload = await fetchJson("/api/stores");

        const stores = (payload && payload.stores) || [];
        if (!Array.isArray(stores) || stores.length === 0) {
          throw new Error("No stores returned by /api/stores");
        }

        storeSelect.innerHTML = "";
        for (const s of stores) {
          const opt = document.createElement("option");
          opt.value = s;
          opt.textContent = s;
          storeSelect.appendChild(opt);
        }

        storeSelect.disabled = false;
        setStatus(`Loaded ${stores.length} stores.`, "idle");
        return stores;
      }

      async function loadSalesForStore(store) {
        if (!store) return;
        setStatus(`Fetching sales for ${store}...`, "loading");

        const payload = await fetchJson(`/api/sales?store=${encodeURIComponent(store)}`);
        const rows = (payload && payload.data) || [];
        if (!Array.isArray(rows)) {
          throw new Error("Unexpected payload from /api/sales");
        }

        renderSalesChart(store, rows);
        setStatus(`Rendered ${rows.length} rows for ${store}.`, "idle");
      }

      function wireUpApiBaseControls() {
        const apiBaseInput = document.getElementById("apiBase");
        const saveBtn = document.getElementById("saveApi");
        apiBaseInput.value = getApiBase();

        saveBtn.addEventListener("click", async () => {
          const v = apiBaseInput.value.trim() || DEFAULT_API_BASE;
          localStorage.setItem("apiBase", v);
          log("apiBase saved", v);

          try {
            renderEmptyChart();
            const stores = await loadStores();
            const storeSelect = document.getElementById("storeSelect");
            storeSelect.value = stores[0];
            await loadSalesForStore(stores[0]);
          } catch (e) {
            console.error(e);
            setStatus(String(e.message || e), "error");
          }
        });
      }

      async function main() {
        wireUpApiBaseControls();
        renderEmptyChart();

        const storeSelect = document.getElementById("storeSelect");
        storeSelect.addEventListener("change", async () => {
          const store = storeSelect.value;
          try {
            await loadSalesForStore(store);
          } catch (e) {
            console.error(e);
            setStatus(String(e.message || e), "error");
          }
        });

        try {
          const stores = await loadStores();
          storeSelect.value = stores[0];
          await loadSalesForStore(stores[0]);
        } catch (e) {
          console.error(e);
          setStatus(String(e.message || e), "error");
        }
      }

      main();
    </script>
  </body>
</html>
